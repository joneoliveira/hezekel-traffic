<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 46">
  <!-- Ascending bars (traffic signal) -->
  <rect x="2"  y="32" width="9" height="12" rx="2" fill="#C8922A" opacity="0.55"/>
  <rect x="15" y="23" width="9" height="21" rx="2" fill="#C8922A" opacity="0.70"/>
  <rect x="28" y="13" width="9" height="31" rx="2" fill="#C8922A" opacity="0.85"/>
  <rect x="41" y="3"  width="9" height="41" rx="2" fill="#C8922A"/>

  <!-- Separator -->
